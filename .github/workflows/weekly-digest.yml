name: Weekly digest

on:
  schedule:
    - cron: '0 6 * * 1' # понедельник 06:00 UTC = 09:00 МСК (UTC+3, без летнего времени)
  workflow_dispatch:
    inputs:
      week:
        description: 'Неделя YYYY-MM-DD (пусто — последняя в data/latest.js)'
        required: false
        type: string

# Выпуск и архив — производные снапшота недели, они коммитятся в master и
# уезжают на сайт обычным deploy.yml по push. Отправка — отдельный шаг: без
# секретов он завершается notice-skip, а не красным фейлом.
permissions:
  contents: write
  # gh workflow run — push от GITHUB_TOKEN не порождает deploy.yml
  # (та же причина, что в weekly-calc.yml).
  actions: write

concurrency:
  group: weekly-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      # Actions закреплены по полному SHA (тот же пиннинг, что в deploy.yml и
      # weekly-calc.yml; обновления — через .github/dependabot.yml).
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Определить неделю
        id: week
        env:
          # Dispatch-ввод передаём через env, а не инлайн в bash.
          WEEK_INPUT: ${{ inputs.week }}
        run: |
          WEEK="$WEEK_INPUT"
          if [ -z "$WEEK" ]; then
            WEEK=$(node -e "
              const fs = require('fs');
              const m = fs.readFileSync('data/latest.js', 'utf8').match(/CI_LATEST\s*=\s*\"([0-9]{4}-[0-9]{2}-[0-9]{2})\"/);
              if (!m) process.exit(1);
              process.stdout.write(m[1]);
            ")
          fi
          if ! echo "$WEEK" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "::error::Неверный формат недели: $WEEK (нужен YYYY-MM-DD)"
            exit 1
          fi
          echo "value=$WEEK" >> "$GITHUB_OUTPUT"
          echo "Неделя дайджеста: $WEEK"

      - name: Ворота пропуска (тихий skip)
        id: gate
        env:
          WEEK: ${{ steps.week.outputs.value }}
        run: |
          if [ ! -f "data/$WEEK/week.js" ]; then
            echo "::notice::Пропуск: нет снапшота data/$WEEK/week.js"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Сгенерировать выпуск и архив
        if: steps.gate.outputs.skip == 'false'
        env:
          WEEK: ${{ steps.week.outputs.value }}
        run: node calc/digest-export.js --write --week "$WEEK"

      - name: Коммит выпуска
        if: steps.gate.outputs.skip == 'false'
        env:
          WEEK: ${{ steps.week.outputs.value }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digest.html data/public/digest
          if git diff --cached --quiet; then
            echo "::notice::Выпуск уже записан — коммит не требуется"
            exit 0
          fi
          git commit -m "дайджест недели $WEEK"
          git push origin master

      - name: Отправить выпуск
        if: steps.gate.outputs.skip == 'false'
        env:
          WEEK: ${{ steps.week.outputs.value }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DIGEST_EMAIL_ENDPOINT: ${{ secrets.DIGEST_EMAIL_ENDPOINT }}
          DIGEST_EMAIL_TOKEN: ${{ secrets.DIGEST_EMAIL_TOKEN }}
          DIGEST_EMAIL_FROM: ${{ secrets.DIGEST_EMAIL_FROM }}
          DIGEST_EMAIL_TO: ${{ secrets.DIGEST_EMAIL_TO }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] && [ -z "$DIGEST_EMAIL_ENDPOINT" ]; then
            echo "::notice::Секреты дайджеста не заданы — шаг отправки пропущен"
            exit 0
          fi
          node calc/digest-send.js --send --week "$WEEK"

      - name: Записать sent.json
        if: steps.gate.outputs.skip == 'false'
        run: |
          if [ ! -f data/digest/sent.json ]; then
            echo "::notice::sent.json не изменился — коммит не требуется"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/digest/sent.json
          if git diff --cached --quiet; then
            echo "::notice::Нет изменений в sent.json — коммит не требуется"
            exit 0
          fi
          git commit -m "дайджест: отправка отмечена в sent.json"
          git push origin master

      # push от GITHUB_TOKEN не триггерит другие workflow — деплой запускается
      # явно (как в weekly-calc.yml), иначе архив выпуска не доезжает до сайта.
      - name: Запустить деплой
        if: steps.gate.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref master
