name: Weekly digest

on:
  schedule:
    - cron: '0 6 * * 1' # понедельник 06:00 UTC = 09:00 МСК (UTC+3, без летнего времени)
  workflow_dispatch:
    inputs:
      week:
        description: 'Неделя YYYY-MM-DD (пусто — последняя в data/latest.js)'
        required: false
        type: string

# Выпуск и архив — производные снапшота недели, они коммитятся в master и
# уезжают на сайт обычным deploy.yml по push. Отправка — отдельный job, который
# ждёт одобрения редактора (GitHub Environment с required reviewer) и только
# потом резервирует и отправляет каналы. Без секретов шаги завершаются
# notice-skip, а не красным фейлом.
#
# ВАЖНО: пауза на одобрение обеспечивается настройкой репозитория, а не этим
# файлом. Environment `digest-approval` должен существовать с required reviewer
# (см. AGENTS.md, «Публикация» / «Окружение»). Если environment не настроен,
# GitHub создаст его пустым — и job отправки пройдёт без подтверждения.
permissions:
  contents: write
  # gh workflow run — push от GITHUB_TOKEN не порождает deploy.yml
  # (та же причина, что в weekly-calc.yml).
  actions: write

concurrency:
  group: weekly-digest
  cancel-in-progress: false

jobs:
  # Подготовка: выпуск, архив и превью редактору. Ничего не отправляет в
  # каналы и не пишет sent.json — до одобрения публикация не начинается.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      week: ${{ steps.week.outputs.value }}
      skip: ${{ steps.gate.outputs.skip }}
    steps:
      # Actions закреплены по полному SHA (тот же пиннинг, что в deploy.yml и
      # weekly-calc.yml; обновления — через .github/dependabot.yml).
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Определить неделю
        id: week
        env:
          # Dispatch-ввод передаём через env, а не инлайн в bash.
          WEEK_INPUT: ${{ inputs.week }}
        run: |
          WEEK="$WEEK_INPUT"
          if [ -z "$WEEK" ]; then
            WEEK=$(node -e "
              const fs = require('fs');
              const m = fs.readFileSync('data/latest.js', 'utf8').match(/CI_LATEST\s*=\s*\"([0-9]{4}-[0-9]{2}-[0-9]{2})\"/);
              if (!m) process.exit(1);
              process.stdout.write(m[1]);
            ")
          fi
          if ! echo "$WEEK" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "::error::Неверный формат недели: $WEEK (нужен YYYY-MM-DD)"
            exit 1
          fi
          echo "value=$WEEK" >> "$GITHUB_OUTPUT"
          echo "Неделя дайджеста: $WEEK"

      - name: Ворота пропуска (тихий skip)
        id: gate
        env:
          WEEK: ${{ steps.week.outputs.value }}
        run: |
          if [ ! -f "data/$WEEK/week.js" ]; then
            echo "::notice::Пропуск: нет снапшота data/$WEEK/week.js"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Сгенерировать выпуск и архив
        if: steps.gate.outputs.skip == 'false'
        env:
          WEEK: ${{ steps.week.outputs.value }}
        run: node calc/digest-export.js --write --week "$WEEK"

      - name: Коммит выпуска
        if: steps.gate.outputs.skip == 'false'
        env:
          WEEK: ${{ steps.week.outputs.value }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digest.html data/public/digest
          if git diff --cached --quiet; then
            echo "::notice::Выпуск уже записан — коммит не требуется"
            exit 0
          fi
          git commit -m "дайджест недели $WEEK"
          git push origin master

      # Превью уходит в отдельный чат редактора (TELEGRAM_EDITOR_CHAT_ID) ДО
      # одобрения: тот же текст, что уйдёт в канал. sent.json не меняется.
      # Не заданы секреты превью — тихий skip, одобрение всё равно доступно по
      # диффу digest.html.
      - name: Превью редактору
        if: steps.gate.outputs.skip == 'false'
        env:
          WEEK: ${{ steps.week.outputs.value }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_EDITOR_CHAT_ID: ${{ secrets.TELEGRAM_EDITOR_CHAT_ID }}
          # Ссылка «где одобрить» прямо в превью: job publish ждёт ревьюера.
          DIGEST_APPROVAL_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_EDITOR_CHAT_ID" ]; then
            echo "::notice::Превью не отправлено: не заданы TELEGRAM_BOT_TOKEN/TELEGRAM_EDITOR_CHAT_ID"
            exit 0
          fi
          node calc/digest-send.js --preview --week "$WEEK"

  # Отправка: job висит на environment с required reviewer — workflow
  # останавливается здесь и продолжается только после одобрения редактора.
  publish:
    needs: prepare
    if: needs.prepare.outputs.skip == 'false'
    runs-on: ubuntu-latest
    environment:
      name: digest-approval
      url: https://cassindex.ru/digest.html
    steps:
      # master, а не SHA запуска: job подготовки уже закоммитил выпуск, и
      # резерв/отметка должны лечь поверх него, иначе push отклоняется.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: master

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # Порядок шагов здесь — часть защиты от повторного поста: отметка о
      # намерении уходит в master ДО первого запроса. Успешный пост с
      # отклонённым пушем иначе повторился бы на следующем прогоне.
      - name: Отметить отправку до запроса (резерв)
        env:
          WEEK: ${{ needs.prepare.outputs.week }}
          RUN_ID: ${{ github.run_id }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DIGEST_EMAIL_ENDPOINT: ${{ secrets.DIGEST_EMAIL_ENDPOINT }}
          DIGEST_EMAIL_TOKEN: ${{ secrets.DIGEST_EMAIL_TOKEN }}
          DIGEST_EMAIL_FROM: ${{ secrets.DIGEST_EMAIL_FROM }}
          DIGEST_EMAIL_TO: ${{ secrets.DIGEST_EMAIL_TO }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] && [ -z "$DIGEST_EMAIL_ENDPOINT" ]; then
            echo "::notice::Секреты дайджеста не заданы — отправка и отметка пропущены"
            exit 0
          fi
          node calc/digest-send.js --reserve --week "$WEEK" --run-id "$RUN_ID"

      - name: Зафиксировать отметку в master (до отправки)
        env:
          WEEK: ${{ needs.prepare.outputs.week }}
        run: |
          if [ ! -f data/digest/sent.json ]; then
            echo "::notice::sent.json не создан — фиксировать нечего"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/digest/sent.json
          if git diff --cached --quiet; then
            echo "::notice::Нет изменений в sent.json — коммит не требуется"
            exit 0
          fi
          git commit -m "дайджест: отправка недели $WEEK зарезервирована"
          for attempt in 1 2 3; do
            if git push origin master; then
              exit 0
            fi
            echo "::warning::push отметки не прошёл (попытка $attempt) — подтягиваю master"
            git pull --rebase --autostash origin master || true
            sleep 5
          done
          echo "::error::Отметка не зафиксирована в master — отправка отменена, чтобы не постить дважды"
          exit 1

      - name: Отправить выпуск
        env:
          WEEK: ${{ needs.prepare.outputs.week }}
          RUN_ID: ${{ github.run_id }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DIGEST_EMAIL_ENDPOINT: ${{ secrets.DIGEST_EMAIL_ENDPOINT }}
          DIGEST_EMAIL_TOKEN: ${{ secrets.DIGEST_EMAIL_TOKEN }}
          DIGEST_EMAIL_FROM: ${{ secrets.DIGEST_EMAIL_FROM }}
          DIGEST_EMAIL_TO: ${{ secrets.DIGEST_EMAIL_TO }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] && [ -z "$DIGEST_EMAIL_ENDPOINT" ]; then
            echo "::notice::Секреты дайджеста не заданы — шаг отправки пропущен"
            exit 0
          fi
          node calc/digest-send.js --send --week "$WEEK" --run-id "$RUN_ID"

      - name: Отметить доставленные каналы
        # always(): сбой отправки тоже надо зафиксировать — снятый резерв даёт
        # следующий прогон, а не тихую потерю канала.
        if: always()
        run: |
          if [ ! -f data/digest/sent.json ]; then
            echo "::notice::sent.json не изменился — коммит не требуется"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/digest/sent.json
          if git diff --cached --quiet; then
            echo "::notice::Нет изменений в sent.json — коммит не требуется"
            exit 0
          fi
          git commit -m "дайджест: доставленные каналы отмечены в sent.json"
          # Резерв уже в master: неудачный push здесь дубля не даёт (следующий
          # прогон увидит резерв чужого прогона и не станет постить сам).
          for attempt in 1 2 3; do
            if git push origin master; then
              exit 0
            fi
            echo "::warning::push sent.json не прошёл (попытка $attempt)"
            git pull --rebase --autostash origin master || true
            sleep 5
          done
          echo "::warning::sent.json не уехал в master — повтора не будет, канал останется в резерве"

      # push от GITHUB_TOKEN не триггерит другие workflow — деплой запускается
      # явно (как в weekly-calc.yml), иначе архив выпуска не доезжает до сайта.
      - name: Запустить деплой
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref master
