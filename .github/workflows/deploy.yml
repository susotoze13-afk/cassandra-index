name: Deploy to GitHub Pages

on:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Actions закреплены по полному SHA (коммит-пиннинг против supply-chain
      # на мутабельных тегах). Обновлять осознанно, сверяя SHA с релизом;
      # предыстория — docs/security-review.md (F-06).
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Stage site files
        run: |
          mkdir -p _site
          cp index.html privacy.html icon.svg _site/
          cp -r css js data _site/
          # Внутренний журнал аудита не публикуется — раскрывал бы governance-след
          # (docs/security-review.md, F-02).
          rm -f _site/data/audit.jsonl
          echo cassindex.ru > _site/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
