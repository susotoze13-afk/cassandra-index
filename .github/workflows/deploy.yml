name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # Явный запуск после автопуша weekly-calc.yml: push от GITHUB_TOKEN не
  # порождает другие workflow, поэтому деплой запускается через gh workflow run.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Actions закреплены по полному SHA (коммит-пиннинг против supply-chain
      # на мутабельных тегах). Обновлять осознанно, сверяя SHA с релизом;
      # предыстория — docs/security-review.md (F-06).
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Stage site files
        run: |
          mkdir -p _site
          # Белый список корня: страница, которая сюда не добавлена, не публикуется.
          # Прототип (cassandra-index-prototype.html) — read-only, наружу не идёт.
          cp index.html privacy.html about.html how-to-read.html changelog.html digest.html \
             articles.html compare.html compare-war-monitor.html compare-acled.html \
             compare-crisiswatch.html validation.html icon.svg robots.txt sitemap.xml llms.txt _site/
          cp -r css js data _site/
          cp -r blog _site/
          # Внутренний журнал аудита не публикуется — раскрывал бы governance-след
          # (docs/security-review.md, F-02).
          rm -f _site/data/audit.jsonl
          echo cassindex.ru > _site/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
