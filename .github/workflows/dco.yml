name: DCO

# Подпись Developer Certificate of Origin (DCO 1.1) в каждом коммите pull request.
# Сторонних action нет: checkout по SHA-пину и штатный node на runner.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      # Actions закреплены по полному SHA (docs/security-review.md, F-06).
      # fetch-depth: 0 — нужна история, чтобы увидеть все коммиты диапазона PR.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Проверка Signed-off-by
        # Скрипт берётся из базовой ветки: иначе PR может ослабить свой же гейт,
        # отредактировав tools/check-dco.js в том же коммите.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          SCRIPT="$(mktemp -d)/check-dco.js"
          if git show "$BASE_SHA:tools/check-dco.js" > "$SCRIPT" 2>/dev/null; then
            echo "проверка подписи: скрипт из базовой ветки $BASE_SHA"
          else
            echo "проверка подписи: в базовой ветке скрипта нет, берём из PR"
            cp tools/check-dco.js "$SCRIPT"
          fi
          node "$SCRIPT" "$BASE_SHA" "$HEAD_SHA"
